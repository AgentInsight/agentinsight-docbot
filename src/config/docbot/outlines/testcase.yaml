report_type: testcase
name_zh: 测试用例文档
name_en: Test Case Document
default_chapters: 11
max_chapters: 20

persona:
  role: 测试架构师
  mission: 生成结构化、可解析、覆盖全生命周期的测试用例文档
  target_audience:
    - 测试工程师:用例设计、缺陷管理、执行计划
    - 开发工程师:用例覆盖、自动化集成
    - PM/SRE:质量门禁、风险评估
    - 法务:数据合规与脱敏

chapters:
  - idx: 1
    title: 引言
    purpose: 阐明编写目的、项目背景、文档范围与参考文档
    sections: []
    key_points:
      - 编写目的与目标读者
      - 项目背景与版本目标
      - 文档范围 In/Out-of-Scope
      - 术语与缩略语 SIT/UAT/RTM/DoD
      - 参考文档 PRD/HLD/接口规范
      - 版本历史

  - idx: 2
    title: 测试范围
    purpose: 明确测试模块、类型覆盖与排除项
    sections: []
    key_points:
      - 范围矩阵模块/类型/优先级/FR
      - 测试类型单元/集成/系统/性能/安全
      - 假设与排除项环境/账号/Mock

  - idx: 3
    title: 测试策略与方法
    purpose: 定义测试分层、用例设计方法与自动化策略
    sections: []
    key_points:
      - 测试分层金字塔与自动化率
      - 设计方法等价类/边界值/决策表/状态迁移
      - 自动化策略范围/框架/触发/报告
      - 探索式测试时间盒与主题
      - 回归策略触发/范围/优先级

  - idx: 4
    title: 测试环境
    purpose: 定义环境清单、软硬件配置与数据隔离
    sections: []
    key_points:
      - 环境清单 Dev/Test/Staging/Prod
      - 软硬件配置 CPU/内存/数据库版本
      - 网络与依赖 VPC/Mock/服务桩
      - 数据隔离与回收按租户/账号
      - 环境治理申请/漂移/监控

  - idx: 5
    title: 测试用例设计
    purpose: 定义用例编号规则、覆盖率目标与用例模板
    sections: []
    key_points:
      - 用例编号 TC-<模块>-NNN
      - 覆盖率需求/代码/路径
      - 模块用例清单 P0/P1/P2/自动化
      - 用例模板前置/步骤/期望/数据
      - 用例设计示例
    example: |
      ```markdown
      ### TC-<模块>-NNN <用例标题>
      - **优先级**：P0/P1/P2
      - **类型**：功能/接口/性能/安全/兼容
      - **关联需求**：FR-001
      - **前置条件**：
        1. <条件>
      - **测试步骤**：
        1. <步骤> → 期望：<结果>
      - **测试数据**：<引用 §6 数据 ID>
      ```

  - idx: 6
    title: 测试数据
    purpose: 定义数据清单、生成策略与脱敏规范
    sections: []
    key_points:
      - 数据清单 ID/名称/类型/用途
      - 数据生成脱敏/Faker/Fixture/边界
      - 数据脱敏手机号/身份证/银行卡
      - 数据管理存储/版本/隔离/回收
      - 数据合规来源/留存/销毁

  - idx: 7
    title: 进入/退出条件与质量门禁
    purpose: 定义 DoR/DoD 与各阶段质量门禁
    sections: []
    key_points:
      - 进入条件 DoR 需求/设计/环境/数据/自测
      - 退出条件 DoD 执行率/通过率/缺陷
      - 质量门禁 PR/CI/预发/发布指标
      - 缓冲与豁免 RFC/审批/缓冲期

  - idx: 8
    title: 缺陷管理
    purpose: 定义缺陷生命周期、分级与报告模板
    sections: []
    key_points:
      - 缺陷生命周期 New/Closed/Reopened
      - 严重度分级 P0/P1/P2/P3/P4 与 SLA
      - 优先级矩阵严重度×优先级
      - 缺陷报告模板复现/期望/实际
      - 缺陷统计日报/周报/看板
      - 根因分析 5 Whys/鱼骨图
    example: |
      ```markdown
      ### BUG-NNNN <缺陷标题>
      - **严重度**：P0/P1/P2/P3
      - **优先级**：高/中/低
      - **环境**：<环境名>
      - **复现步骤**：
        1. <步骤>
      - **期望结果**：<期望>
      - **实际结果**：<实际>
      - **关联用例**：TC-XXX
      ```

  - idx: 9
    title: 测试计划与资源
    purpose: 定义里程碑、人力资源与工具平台
    sections: []
    key_points:
      - 测试里程碑评审/首轮/回归/UAT/上线
      - 人力资源经理/功能/自动化/性能/安全
      - 工具平台 TestRail/Jira/Pytest
      - 培训与沟通站会/周会/评审

  - idx: 10
    title: 风险评估与应急
    purpose: 登记测试风险、监控指标与应急预案
    sections: []
    key_points:
      - 风险登记概率/影响/缓解/应急
      - 风险监控可用率/执行率/修复率
      - 应急预案环境/缺陷/数据丢失
      - 回退方案触发/步骤/通知

  - idx: 11
    title: 附录
    purpose: 提供术语表、用例详述、追踪矩阵与报告模板
    sections: []
    key_points:
      - 术语表与 §1.4 同步
      - 模块用例详述按 §5.4 模板
      - 需求-用例-缺陷 RTM
      - 测试报告模板周期/执行/缺陷/结论
      - 检查清单评审/环境/数据/CI/上线
      - 参考资料 ISTQB/IEEE 829/29119

writing_rules:
  - 使用 TC/TS/BUG 编号体系
  - 按统一模板编写用例便于解析
  - 明确步骤→期望对应关系
  - 关联缺陷到具体用例 TC-XXX
  - 维护 RTM 端到端追踪
  - 纳入自动化用例到 CI 流水线

output_format:
  default_language: zh
  default_format: markdown
  chapter_numbering: "1, 1.1, 1.1.1"
  diagrams: SVG (由系统自动生成并内嵌, 禁止 PlantUML/Mermaid)
  tables: Markdown 表格
  to_word: pandoc 本文件 -o 输出.docx --toc --toc-depth=3
