report_type: testcase
name_zh: 测试用例文档
name_en: Test Case Document
default_chapters: 11
max_chapters: 20

persona:
  role: 测试架构师
  mission: >
    生成以可执行用例清单为主体的测试用例文档（前置/步骤/期望/数据），可追溯到需求或接口。
    不等于缺陷发现清单（defect），也不以测试管理规范/流程为主体。
  target_audience:
    - 测试工程师:用例设计与执行
    - 开发工程师:用例覆盖、自动化集成
    - PM/SRE:质量门禁、风险评估

chapters:
  - idx: 1
    title: 引言
    purpose: 阐明编写目的、项目背景、文档范围与参考文档
    sections: []
    key_points:
      - 编写目的与目标读者
      - 项目背景与版本目标
      - 文档范围 In/Out-of-Scope
      - 术语与缩略语 SIT/UAT/RTM/DoD
      - 参考文档 PRD/HLD/接口规范
      - 版本历史

  - idx: 2
    title: 测试范围
    purpose: 明确测试模块、类型覆盖与排除项
    sections: []
    key_points:
      - 范围矩阵模块/类型/优先级/FR
      - 测试类型单元/集成/系统/性能/安全
      - 假设与排除项环境/账号/Mock

  - idx: 3
    title: 测试策略与方法
    purpose: 定义测试分层、用例设计方法与自动化策略
    sections: []
    key_points:
      - 测试分层金字塔与自动化率
      - 设计方法等价类/边界值/决策表/状态迁移
      - 自动化策略范围/框架/触发/报告
      - 探索式测试时间盒与主题
      - 回归策略触发/范围/优先级

  - idx: 4
    title: 测试环境
    purpose: 定义环境清单、软硬件配置与数据隔离
    sections: []
    key_points:
      - 环境清单 Dev/Test/Staging/Prod
      - 软硬件配置 CPU/内存/数据库版本
      - 网络与依赖 VPC/Mock/服务桩
      - 数据隔离与回收按租户/账号
      - 环境治理申请/漂移/监控

  - idx: 5
    title: 测试用例设计
    purpose: 定义用例编号规则、覆盖率目标与用例模板
    sections: []
    key_points:
      - 用例编号 TC-<模块>-NNN
      - 覆盖率需求/代码/路径
      - 模块用例清单 P0/P1/P2/自动化
      - 用例模板前置/步骤/期望/数据
      - 用例设计示例
    example: |
      ```markdown
      ### TC-<模块>-NNN <用例标题>
      - **优先级**：P0/P1/P2
      - **类型**：功能/接口/性能/安全/兼容
      - **关联需求**：FR-001
      - **前置条件**：
        1. <条件>
      - **测试步骤**：
        1. <步骤> → 期望：<结果>
      - **测试数据**：<引用 §6 数据 ID>
      ```

  - idx: 6
    title: 测试数据
    purpose: 定义数据清单、生成策略与脱敏规范
    sections: []
    key_points:
      - 数据清单 ID/名称/类型/用途
      - 数据生成脱敏/Faker/Fixture/边界
      - 数据脱敏手机号/身份证/银行卡
      - 数据管理存储/版本/隔离/回收
      - 数据合规来源/留存/销毁

  - idx: 7
    title: 进入/退出条件与质量门禁
    purpose: 定义 DoR/DoD 与各阶段质量门禁
    sections: []
    key_points:
      - 进入条件 DoR 需求/设计/环境/数据/自测
      - 退出条件 DoD 执行率/通过率/缺陷
      - 质量门禁 PR/CI/预发/发布指标
      - 缓冲与豁免 RFC/审批/缓冲期

  - idx: 8
    title: 缺陷关联字段
    purpose: 定义用例与缺陷条目的关联字段（附录级，非缺陷管理规范）
    sections: []
    key_points:
      - 关联字段：用例 ID / 缺陷 ID / 严重度 / 状态（字段说明即可）
      - 缺陷报告最小字段：复现/期望/实际/关联用例 TC-XXX
      - 禁止展开缺陷生命周期状态机、SLA、负责人矩阵、运营看板为主体
      - 代码级缺陷发现清单属于 defect 文档类型，本文不替代
    example: |
      ```markdown
      | 用例 ID | 缺陷 ID | 严重度 | 状态 | 备注 |
      |---------|---------|--------|------|------|
      | TC-XXX-001 | BUG-NNNN | P1 | Open | 关联 FR-001 |
      ```

  - idx: 9
    title: 测试计划与资源
    purpose: 定义里程碑、人力资源与工具平台（要点级，非测管手册）
    sections: []
    key_points:
      - 测试里程碑评审/首轮/回归/UAT/上线（要点）
      - 人力资源与工具平台要点
      - 禁止写成冗长组织流程规范

  - idx: 10
    title: 风险评估与应急
    purpose: 登记测试执行风险与应急要点
    sections: []
    key_points:
      - 风险登记概率/影响/缓解
      - 应急/回退触发要点
      - 禁止写成运维变更管理长文

  - idx: 11
    title: 附录
    purpose: 提供术语表、用例详述、追踪矩阵与检查清单
    sections: []
    key_points:
      - 术语表
      - 模块用例详述（按用例模板）
      - 需求-用例-缺陷关联 RTM
      - 检查清单评审/环境/数据/CI
      - 参考资料 ISTQB/IEEE 829/29119（可选）

writing_rules:
  - 主体是可执行用例清单（前置/步骤/期望/数据），可追溯到需求或接口
  - 不等于 defect（代码缺陷发现）；不等于测试管理规范主体
  - 缺陷关联仅字段级附录；禁止 SLA/状态机/负责人矩阵为主体
  - 使用 TC/TS 编号体系；明确步骤→期望对应关系
  - 维护 RTM 端到端追踪；图表禁止 PlantUML/Mermaid
  - 禁止硬编码与本仓库无关的特定产品/仓库业务事实

output_format:
  default_language: zh
  default_format: markdown
  chapter_numbering: "1, 1.1, 1.1.1"
  diagrams: SVG (由系统自动生成并内嵌, 禁止 PlantUML/Mermaid)
  tables: Markdown 表格
  to_word: pandoc 本文件 -o 输出.docx --toc --toc-depth=3
