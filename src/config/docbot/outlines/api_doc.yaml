report_type: api_doc
name_zh: API 文档
name_en: API Document
default_chapters: 12
max_chapters: 20

persona:
  role: API 设计工程师
  mission: >
    生成集成向完整契约文档（方法/路径/参数/错误码/示例），可驱动 SDK 与客户端集成。
    禁止重复撰写总体模块构架长文（留给 architecture/design）；与 design「接口设计要点」互链。
  target_audience:
    - 前端/移动端开发者：关注接口详情与 SDK
    - 第三方开发者：关注认证授权与 Webhook
    - 后端工程师：关注接口契约与版本治理

chapters:
  - idx: 1
    title: 引言
    purpose: 阐明编写目的、适用范围与参考文档
    sections: []
    key_points:
      - 编写目的（前端/移动端/第三方/集成商）
      - 适用范围（v1.0、HTTP/HTTPS、JSON、RESTful）
      - 术语缩略语（API、JWT、OAuth2、RBAC）
      - 参考文档（架构/概设/OpenAPI 规范）
      - 版本历史

  - idx: 2
    title: API 概览
    purpose: 提供基础信息、API 分类与清单
    sections: []
    key_points:
      # v8-P0-D: 去硬编码, 改为"从代码提取"引导语, 消除 LLM 照搬通用示例污染
      - 基础信息（Base URL 从代码配置提取、数据格式 JSON、时间格式 ISO 8601、字符集 UTF-8）
      - API 分类（从代码 Controller/路由模块动态推导, 不预设具体路径, 见 {endpoints_text}）
      - API 清单（API-NNN/方法/路径/描述/鉴权, 必须覆盖所有 HTTP 端点, 见 {endpoints_text}）
      - 通用响应结构（从代码 ApiResponse<T>/Result<T> 类提取真实字段, 不预设字段名）
      - OpenAPI 规范（Swagger UI 入口从代码配置提取, 不预设 URL）
    example: |
      ```json
      // 通用响应结构必须从代码 ApiResponse<T> / Result<T> 类提取真实字段
      // 禁止使用 code/message/traceId 等预设字段名, 必须使用代码中的实际字段名
      // 字段示例仅作格式参考, 实际字段名/类型由代码决定
      {
        "<从代码提取的字段1>": "<类型>",
        "<从代码提取的字段2>": { },
        "<从代码提取的字段3>": "<类型>"
      }
      ```

  - idx: 3
    title: 认证与授权
    purpose: 定义认证方式、OAuth2 流程、Token 规范与权限矩阵
    sections: []
    key_points:
      - 认证方式（OAuth2、API Key、JWT、mTLS）
      - OAuth2 流程（授权码→token→访问→refresh）
      - Token 规范（Bearer、access 2h/refresh 30d）
      - 授权模型（RBAC、ABAC、资源所有者校验）
      - 权限矩阵（角色 admin/user、CRUD 操作）

  - idx: 4
    title: 通用约定
    purpose: 统一命名、HTTP 方法语义、版本、分页、过滤与幂等性
    sections: []
    key_points:
      # v8-P0-D: 去硬编码, 技术规格必须从代码配置文件提取
      - 命名规范（从代码 Controller/路由/DTO 推导实际命名风格, 不预设 kebab-case/camelCase）
      - HTTP 方法语义（GET/POST/PUT/PATCH/DELETE, 标准语义）
      - 版本策略（从代码配置/路由前缀提取, 不预设 /v1/ 或兼容期, 见 {config_specs_text}）
      - 分页规范（从代码配置提取真实参数名和默认值, 如 page/pageSize 而非预设 cursor/limit, 见 {config_specs_text}）
      - 过滤排序（从代码路由/DTO 提取实际查询参数名, 不预设 ?status=/?sort=）
      - 幂等性（从代码提取实际幂等键名和保留时长, 见 {config_specs_text}）
      - 国际化（Accept-Language、X-Timezone, 若代码无相关支持则本节标注"未实现"）
      - 请求头约定（从代码 Middleware/Filter 提取实际请求头名, 不预设 Authorization/X-Request-Id）

  - idx: 5
    title: 错误处理
    purpose: 定义错误响应结构、HTTP 状态码与业务错误码
    sections: []
    key_points:
      # v8-P0-D: 去硬编码, 错误码必须从代码枚举提取
      - 错误响应结构（从代码 ApiResponse<T>/ExceptionCodes 提取真实字段, 不预设 code/message/details/traceId）
      - HTTP 状态码（200/400/401/403/404/429/500, 标准语义）
      - 业务错误码分段（从代码枚举定义提取真实错误码数值和常量名, 见 {enums_text}）
      - 错误码清单（必须列出代码中所有错误码常量, 见 {enums_text}, 禁止编造分段体系）
      - 重试建议（4xx 不重试、5xx 退避、429 Retry-After, 标准建议）
    example: |
      ```json
      // 错误响应结构必须从代码 ApiResponse<T> / ExceptionCodes 真实字段提取
      // 错误码数值和常量名必须来自 {enums_text}, 禁止使用 40001 等预设示例
      {
        "<从代码提取的错误码字段>": "<数值来自 {enums_text}>",
        "<从代码提取的消息字段>": "<消息文本>",
        "<从代码提取的其他字段>": "<值>"
      }
      ```

  - idx: 6
    title: 限流与配额
    purpose: 定义限流策略、配额管理与豁免规则
    sections: []
    key_points:
      - 限流策略（RATE-001 全局/RATE-002 IP/RATE-003 用户）
      - 配额管理（上传 10GB/月、调用 100 万次/月）
      - 限流响应头（X-RateLimit-*、Retry-After）
      - 限流豁免（内部服务、监控探针、白名单）

  - idx: 7
    title: API 详情
    purpose: 按统一模板详述每个接口的请求、响应、错误码与示例
    sections: []
    key_points:
      # v8-P0-D: 去硬编码, 接口必须从代码 AST 提取, 不预设模块名
      - 详情模板（方法/路径/参数/请求体/响应/示例, 每个接口一个卡片）
      - 接口清单必须与 {endpoints_text} 完全对齐, 禁止遗漏, 禁止编造不存在的接口
      - 接口分组从代码 Controller/路由模块动态推导, 不预设认证/用户/订单/商品/文件等模块名
      - 每个接口的请求参数/响应字段必须从代码 DTO/Request/Response 类提取, 不预设字段名
      - 鉴权方式从代码 [Authorize]/@require_auth 注解提取, 不预设 Bearer Token
    example: |
      ```markdown
      ### API-NNN <接口名> (从代码 Controller/路由提取)
      - **方法**：从代码注解提取 (GET/POST/PUT/DELETE)
      - **路径**：从代码路由注解提取 (不预设 /v1/orders)
      - **鉴权**：从代码 [Authorize]/@require_auth 提取
      #### 请求体 (从代码 DTO 类提取字段, 不预设 productId/quantity)
      ```json
      { "<字段名>": "<类型>" }
      ```
      #### 响应 (从代码 ApiResponse<T> 类提取字段)
      ```json
      { "<字段名>": "<类型>" }
      ```
      ```

  - idx: 8
    title: 数据模型
    purpose: 定义实体清单、字段类型规范、枚举值与公共字段
    sections: []
    key_points:
      # v8-P0-D: 去硬编码, 实体名和枚举值从代码提取
      - 实体清单（从代码 DTO/Entity/Model 类提取, 不预设 User/Order/Product）
      - 字段类型（string/int/float/bool/timestamp/uuid/enum, 标准类型）
      - 枚举值（从代码 enum 定义提取真实值, 见 {enums_text}, 不预设 PENDING/PAID/SHIPPED）
      - 公共字段（从代码 BaseEntity/AuditableEntity 提取, 不预设 id/createdAt/updatedAt）

  - idx: 9
    title: Webhook 与回调
    purpose: 定义事件、注册、签名验证与重试策略
    source: conditional  # v10-P0-3: 条件性章节, LLM 必须验证代码是否含 webhook 再决定保留/删除
    refine_reason: "v10: 若 endpoints_text/code_summary 无 webhook/callback 路由, 必须删除 (source=removed), 禁止虚构内容"
    sections: []
    key_points:
      - "v10 条件性章节: 仅当代码学习结果 (code_summary / endpoints_text) 明确包含 webhook/callback 路由时保留, 否则必须删除 (source=removed, refine_reason='代码无 Webhook 路由')"
      - Webhook 事件（order.created/paid/shipped）  # 仅作示例, 实际事件名从代码提取
      - Webhook 注册（POST /v1/webhooks、url+events）
      - 回调签名（HMAC-SHA256、X-Signature）
      - 重试策略（3 次、指数退避 1s/2s/4s）
      - 回调示例（event/data/timestamp）

  - idx: 10
    title: SDK 与示例
    purpose: 提供官方 SDK、使用示例与 Playground
    source: conditional  # v10-P0-3: 条件性章节, LLM 必须验证 scope 是否含 SDK 子项目再决定保留/删除
    refine_reason: "v10: 若 scopes_text 无 SDK 子项目, 必须删除 (source=removed), 禁止虚构内容"
    sections: []
    key_points:
      - "v10 条件性章节: 仅当 scope_detector 识别到独立 SDK 子项目 (scopes_text 含 is_in_scope=unknown/true 的 sdk 目录) 时保留, 否则必须删除"
      - 官方 SDK（Python/JavaScript/Java/Go）  # 仅作示例, 实际语言从代码提取
      - SDK 示例（client.orders.create(...)）
      - Postman/Insomnia（Collection、Environment）
      - cURL 示例库
      - Playground（沙盒环境、测试 Key sk_test_xxx）

  - idx: 11
    title: 版本治理与弃用
    purpose: 定义版本策略、变更分类与弃用流程
    sections: []
    key_points:
      - 版本策略（/v1//v2/、兼容期 6 月、弃用通知）
      - 变更分类（Patch/Minor/Major）
      - 弃用流程（标记→通知→迁移指南→下线）
      - 变更日志（版本/日期/类型/内容）
      - 迁移指南（v1→v2 字段映射）

  - idx: 12
    title: 附录
    purpose: 提供完整错误码表、字段规范、FAQ 与最佳实践
    sections: []
    key_points:
      - 完整错误码表（与 §5.4 同步）
      - 字段命名规范（kebab-case/camelCase/UPPER_SNAKE）
      - FAQ（token 获取/过期、429 排查、5xx 处理）
      - 最佳实践（SDK、token 续期、幂等键、退避重试）
      - 参考资料（OpenAPI 3.0、Stripe/Microsoft 指南）
      - 联系与支持（邮箱、工单、社区、状态页）

writing_rules:
  - 集成向完整契约：每个端点含方法/路径/参数/错误码/示例
  - 禁止重复写总体模块构架/分层蓝图长文（留给 architecture/design）
  - 与 design「接口设计要点」互链：design 写边界，本文写完整契约
  - 遵循编号约定：API-NNN/ERR-NNNN/RATE-NNN；接口清单与 endpoints_text 对齐
  - 按统一模板编写接口，便于自动化解析；为每接口提供 cURL 或一种 SDK 示例
  - 禁止硬编码与本仓库无关的特定产品/仓库业务事实；无证据标注 insufficient_evidence

output_format:
  default_language: zh
  default_format: markdown
  chapter_numbering: "1, 1.1, 1.1.1"
  code_blocks: JSON/YAML/cURL/Python/JavaScript 标注语言类型
  tables: Markdown 表格
  recommendation: 配合 OpenAPI/Swagger UI 自动生成接口详情
  to_word: pandoc 本文件 -o 输出.docx --toc --toc-depth=3
