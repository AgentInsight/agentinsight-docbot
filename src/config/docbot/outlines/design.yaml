report_type: design
name_zh: 概要设计文档
name_en: High-Level Design Document (HLD)
default_chapters: 11
max_chapters: 16

persona:
  role: 系统概要设计师
  mission: >
    将需求转换为未来系统设计，建立强壮系统构架，适配实施环境并考虑性能；
    提供各模块的设计要点、实现方案方向与技术决策依据（概要层级）。
    明确不等于详细设计说明书：不下钻逐函数算法、伪代码或字段级 DDL。
  target_audience:
    - "系统架构师：总体构架、关键决策、模块边界"
    - "后端开发：模块设计要点、接口要点、实现方案方向"
    - "测试工程师：核心流程、接口约定、出错处理策略（验收依据）"
    - "运维工程师：运行环境适配、部署与运行组合要点"

chapters:
  - idx: 1
    title: 引言
    purpose: 阐明编写目的、目标读者、与详细设计/架构文档的边界、术语与参考资料
    sections: []
    key_points:
      - 编写目的（将需求转为系统设计，建立强壮构架）
      - 目标读者：架构师 / 后端 / 测试 / 运维
      - 与详细设计说明书的边界（本文件止于模块与接口要点）
      - 与技术架构文档的边界（本文件侧重需求→模块→接口→数据→运行落地）
      - 术语与缩略语
      - 参考资料与版本历史

  - idx: 2
    title: 设计目标与约束
    purpose: 从需求与代码反推设计目标、非功能约束与实施环境约束
    sections: []
    key_points:
      - 3-5 条核心设计目标（可追溯到需求/代码证据）
      - 功能需求到设计的映射原则
      - 非功能约束（性能/可用性/安全/可维护性，有证据则量化）
      - 实施环境约束（运行时、依赖、部署形态）
      - 明确不在本阶段细化的事项（留给详细设计）

  - idx: 3
    title: 总体设计
    purpose: 描述基本设计概念、总体处理流程、分层结构与功能-模块映射
    sections: []
    key_points:
      - 基本设计概念与架构风格（有证据则写，无证据标注 insufficient_evidence）
      - 总体处理流程（图表化用表格描述，配图由系统生成）
      - 分层/子系统结构与依赖方向
      - 功能需求与程序/模块映射矩阵
      - 尚未解决但必须在实现前关闭的问题（如有）
    example: |
      ## 功能-模块映射
      | 功能域 | 主责模块 | 协作模块 | 证据 |
      |--------|----------|----------|------|
      | <功能> | <模块> | <模块> | path |
      说明: 系统会根据本章节标题自动生成 SVG 架构图并内嵌, 正文不要输出 PlantUML/Mermaid 代码。

  - idx: 4
    title: 模块划分与设计要点
    purpose: 拆分模块并给出各模块设计要点与实现方案方向（概要级）
    sections: []
    key_points:
      - 模块清单：职责、上游/下游依赖、通信方式
      - 每模块设计要点（输入/处理/输出、关键模式，禁止伪代码）
      - 实现方案方向与技术选型依据（为何这样划分）
      - 模块依赖应尽量无环；环依赖须标注风险
    example: |
      ## 模块清单
      | 模块 | 职责 | 设计要点 | 上游 | 下游 | 证据 |
      |------|------|----------|------|------|------|
      | 模块 A | <职责> | <要点> | - | 模块 B | path |
      说明: 系统会根据本章节标题自动生成 SVG 模块依赖图并内嵌, 正文不要输出 PlantUML/Mermaid 代码。

  - idx: 5
    title: 接口设计要点
    purpose: 定义用户/外部/内部接口的设计要点与契约边界（非完整 API 手册）
    sections: []
    key_points:
      - 用户接口要点（命令/入口/交互边界，如适用）
      - 外部接口要点（协议、鉴权边界、与外部系统关系）
      - 内部接口要点（模块间同步/异步、消息或调用约定）
      - 接口契约边界与错误处理约定（概要级，禁止完整 OpenAPI/字段级手册）
      - 与 api_doc 的边界：完整路径/参数表留给 API 文档

  - idx: 6
    title: 数据设计要点
    purpose: 给出逻辑/物理数据结构要点与关键实体关系（非逐字段数据字典）
    sections: []
    key_points:
      - 逻辑结构要点：核心实体与关系（ER 级）
      - 物理结构要点：存储选型、访问方式、一致性策略
      - 数据结构与程序/模块的关系
      - 关键数据流链路（概要）
      - 禁止完整字段级 DDL / 逐列数据字典（属详细设计）
    example: |
      ## 核心实体关系
      | 实体 | 关系 | 说明 | 证据 |
      |------|------|------|------|
      | EntityA | 1:N EntityB | <说明> | path |
      说明: 系统会根据本章节标题自动生成 SVG ER 图并内嵌, 正文不要输出 PlantUML/Mermaid 代码。

  - idx: 7
    title: 运行与部署适配
    purpose: 说明运行模块组合、运行控制与对实施环境的适配
    sections: []
    key_points:
      - 运行模块组合（不同运行控制下的模块集）
      - 运行控制方式与关键资源占用要点
      - 部署拓扑与环境策略要点（Dev/Test/Prod 如有证据）
      - 配置与密钥管理边界（不写密钥原文）
      - 运维可观测性接入点（概要）
    example: |
      ## 部署拓扑要点
      | 区域/节点 | 组件 | 类型 | 依赖 |
      |-----------|------|------|------|
      | <节点> | <组件> | Container/DB/... | <依赖> |
      说明: 系统会根据本章节标题自动生成 SVG 部署图并内嵌, 正文不要输出 PlantUML/Mermaid 代码。

  - idx: 8
    title: 性能与容量设计
    purpose: 为提高性能而进行的概要级设计（目标、容量、关键策略）
    sections: []
    key_points:
      - "性能目标（有证据则写指标；无 runtime 数据标注 confidence=low）"
      - 容量规划与扩容路径要点
      - 关键性能设计策略（缓存/异步/批处理/索引等，绑定代码或配置证据）
      - 已知瓶颈与后续详细设计待细化项
      - 禁止编造无依据的压测数字

  - idx: 9
    title: 出错处理与安全要点
    purpose: 定义出错信息、补救措施、维护检测点与安全边界（概要级）
    sections: []
    key_points:
      - 出错信息与分级策略
      - 补救措施（重试/降级/熔断/限流等，有证据则写）
      - 系统维护检测点与专用模块（如有）
      - 安全边界：认证授权模型、敏感数据保护要点
      - 禁止完整错误码手册与威胁建模长文（可指向相关文档类型）

  - idx: 10
    title: 关键技术决策
    purpose: 记录塑造系统构架的关键 ADR 级技术决策与理由
    sections: []
    key_points:
      - 3-7 条关键决策（决策/理由/备选/后果）
      - 每条决策绑定代码或配置证据
      - 明确对模块划分、接口、数据、运行的影响
      - 未决问题与决策时点

  - idx: 11
    title: 附录
    purpose: 术语表、图表索引、参考资料与变更历史
    sections: []
    key_points:
      - 术语表
      - 图表索引
      - 参考资料
      - 变更历史与评审记录

writing_rules:
  - 概要设计 ≠ 详细设计：禁止伪代码、逐函数算法步骤、完整字段级 DDL、像素级 UI 交互
  - 接口仅写设计要点与契约边界，禁止完整 OpenAPI / 逐接口参数表（留给 api_doc）
  - 数据模型止于实体关系与存储要点，禁止逐列数据字典
  - 每个模块给出设计要点 + 实现方案方向 + 技术决策依据，附 path 证据
  - 与 architecture 区分：architecture 偏系统蓝图与质量属性；design 偏需求→模块→接口→数据→运行的设计落地
  - 禁止硬编码与本仓库无关的特定产品/仓库业务事实
  - 图表由系统自动生成 SVG 内嵌，正文禁止 PlantUML/Mermaid

output_format:
  default_language: zh
  default_format: markdown
  chapter_numbering: "1, 1.1, 1.1.1"
  diagrams: SVG (由系统自动生成并内嵌, 禁止 PlantUML/Mermaid)
  tables: Markdown 表格
  to_word: pandoc 本文件 -o 输出.docx --toc --toc-depth=3
