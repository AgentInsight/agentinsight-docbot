report_type: optimization
name_zh: 系统优化文档
name_en: System Optimization Document
default_chapters: 11
max_chapters: 20

persona:
  role: 首席优化架构师
  mission: 制定结构化可量化可回滚的优化方案
  target_audience:
    - 架构师（瓶颈/方案/架构演进）
    - SRE/运维（实施/回滚/监控验证）
    - 开发（优化项/代码变更/调优）
    - 产品/财务（ROI/成本/收益）

chapters:
  - idx: 1
    title: 现状分析
    purpose: 建立优化前对照基线
    sections: []
    key_points:
      - 系统画像（架构/规模/部署/关键路径）
      - 基线指标（P99/吞吐/SLA/CPU/内存/成本）
      - 监控数据分析（30/90天趋势/热点/异常）
      - 问题清单（编号/类别/严重度/影响/来源）
      - 利益相关方矩阵
      - 优化范围（In/Out-of-Scope）
      - 术语（SLI/SLO/USE/RED/RT/QPS）
      - 参考文档（架构/监控/压测基线报告）

  - idx: 2
    title: 瓶颈定位与分析
    purpose: 定位瓶颈根因与热点
    sections: []
    key_points:
      - 方法论（USE/RED/黄金信号/火焰图/链路）
      - 瓶颈清单（编号/层级/位置/证据/严重度）
      - 根因分析（P0/P1 用 5 Whys 或鱼骨图）
      - 热点定位（代码/SQL/网络/资源节点）
      - 容量水位分析（当前/峰值/上限/耗尽时间）
    example: |
      ### BN-001 <瓶颈名>
      **现象**：<观察>
      **5 Whys**: 1. → <答案> ... 5. → <根因>
      **根因**：<根因>
      **关联瓶颈**：BN-XXX

  - idx: 3
    title: 优化目标
    purpose: 设定量化与非量化目标
    sections: []
    key_points:
      - 目标原则（SMART/北极星指标/不破坏 SLA）
      - 量化目标（维度/当前/目标/幅度/验证/截止）
      - 非量化目标（可维护性/技术债/监控/知识）
      - 优先级矩阵（价值×成本×风险）
      - 范围外（明确不做什么）

  - idx: 4
    title: 优化方案设计
    purpose: 按 9 维度分层给出可落地优化项
    sections: []
    key_points:
      - 方案分层总览（9 维度）
      - 应用与并发（线程/异步/协程/API）
      - 数据库（连接池/读写分离/分片/索引）
      - 缓存与MQ（多级缓存/防穿透/幂等）
      - 网关与韧性（限流/熔断/降级/灰度）
      - 安全（加密/JWT/WAF/脱敏）
      - 架构一致性（分布式事务/多活/CQRS）
      - 可观测与容量（指标/链路/日志/预测）
      - 部署自动化（弹性/IaC/灰度发布）
      - 成本 FinOps（预留/Spot/右尺寸）
      - AI 优化（推理/Token/RAG/向量检索）
      - 方案对比选型表

  - idx: 5
    title: 实施步骤
    purpose: 制定分阶段灰度可回滚路线图
    sections: []
    key_points:
      - 实施原则（先量化/先灰度/最小变更/可观测）
      - 路线图（P1 1-2周/P2 3-6周/P3 7-12周）
      - 灰度策略（1%→10%→50%→100%/观察/升级）
      - 变更窗口（可变/不可变/紧急流程）
      - 实施 Checklist（基线/监控/灰度/回滚/通知）
      - 操作模板（类型/风险/耗时/窗口/步骤/回滚）

  - idx: 6
    title: 风险评估
    purpose: 登记风险监控指标与应急预案
    sections: []
    key_points:
      - 风险登记（编号/类别/概率/影响/缓解/状态）
      - 风险类别（性能/可用性/数据/安全/依赖/容量）
      - 风险监控（错误率/P99/水位/自动动作）
      - 应急预案（雪崩/数据丢失触发条件/动作）

  - idx: 7
    title: 验证方法
    purpose: 对照基线压测 A/B 验证优化效果
    sections: []
    key_points:
      - 验证策略（对照基线/压测/A/B/复测）
      - 压测方案（场景/工具/并发/时长/标准）
      - 验证指标（指标/前/后/目标/达成）
      - 回归测试（功能/性能/兼容性）
      - 长期观察（性能30天/稳定30天/成本1账期）

  - idx: 8
    title: 回滚预案
    purpose: 定义回滚触发条件与演练机制
    sections: []
    key_points:
      - 触发条件（错误率>5%/P99>2x/投诉/异常）
      - 回滚策略（Git Revert/配置/数据/切流）
      - 步骤模板（触发/决策/执行/耗时/验证）
      - 数据回滚（全量+增量+日志/恢复/演练）
      - 流量切换（DNS/网关/LB/RTO/影响）
      - 回滚演练（季度频率/记录/改进）

  - idx: 9
    title: 收益评估与 ROI
    purpose: 量化收益并计算 ROI
    sections: []
    key_points:
      - 业务收益（P99/转化率/NPS）
      - 技术收益（QPS/SLA/可观测覆盖）
      - 成本收益（计算/存储/网络/人力 ¥/月）
      - ROI（投入/年化收益/回收周期/3年ROI）
      - 无形收益（能力提升/债务清理/知识）

  - idx: 10
    title: 持续优化与治理
    purpose: 建立复盘债务登记与下轮迭代
    sections: []
    key_points:
      - 优化看板（位置/指标/趋势图）
      - 复盘机制（版本后/季度/回顾改进）
      - 技术债务登记（编号/影响/偿还/状态）
      - 下一轮迭代（候选/收益/难度/优先级）
      - 持续优化（容量/成本/性能评审/治理）
      - 知识沉淀（手册/案例库/培训）

  - idx: 11
    title: 附录
    purpose: 提供基线压测变更记录追踪矩阵
    sections: []
    key_points:
      - 监控基线（优化前指标/趋势图）
      - 压测报告（链接/场景/数据/结果）
      - 变更记录（日期/项/执行人/内容/结果）
      - 优化项追踪矩阵（项/瓶颈/目标/状态/收益）
      - 参考资料（Gregg/SRE/数据密集型/USE/RED）

writing_rules:
  - 采用编号 OPT/R/MET/PERF/BN/GOAL-NNN
  - 量化每项预期收益与风险
  - 引用监控压测真实数据
  - 通过安全架构师评审
  - 遵循先量化后优化、先灰度后全量
  - 配套回滚方案

output_format:
  default_language: zh
  default_format: markdown
  chapter_numbering: "1, 1.1, 1.1.1"
  diagrams: 趋势图/火焰图/瓶颈分析图
  tables: Markdown 表格
  to_word: pandoc 本文件 -o 输出.docx --toc --toc-depth=3
