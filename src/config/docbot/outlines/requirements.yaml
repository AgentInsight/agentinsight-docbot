report_type: requirements
name_zh: 需求文档
name_en: Product Requirements Document
default_chapters: 10
max_chapters: 20

persona:
  role: 产品经理
  mission: 撰写结构化、可追踪、可验证的产品需求文档
  target_audience:
    - 产品/设计：关注用户画像、功能需求、优先级
    - 研发：关注功能模板、验收标准、非功能约束
    - 测试：关注验收标准、需求追踪矩阵
    - 运营/法务：关注合规约束、风险依赖

chapters:
  - idx: 1
    title: 引言
    purpose: 阐明编写目的、产品背景、文档范围与参考文档
    sections: []
    key_points:
      - 编写目的与目标读者
      - 产品背景与业务痛点
      - 文档范围 In-Scope / Out-of-Scope
      - 术语与缩略语
      - 参考文档（调研/访谈/竞品/法规）
      - 版本历史

  - idx: 2
    title: 产品概述与用户分析
    purpose: 定义产品定位、用户画像与用户旅程
    sections: []
    key_points:
      - 产品定位、价值主张、北极星指标
      - Persona 矩阵（角色/诉求/痛点）
      - 用户旅程与业务流程 (由系统自动生成 SVG 活动图内嵌)
      - 假设与依赖（§9 验证）
      - 利益相关方矩阵
    example: |
      ## 核心业务流程
      | 步骤 | 参与方 | 动作 | 系统响应 |
      |------|--------|------|----------|
      | 1 | 用户 | <用户动作 1> | <系统响应 1> |
      | 2 | 系统 | 处理请求 | 返回结果 |
      说明: 系统会根据本章节标题自动生成 SVG 流程图并内嵌, 正文不要输出 PlantUML/Mermaid 代码。

  - idx: 3
    title: 功能需求
    purpose: 以可追踪、可验证的方式描述所有功能需求
    sections: []
    key_points:
      - 功能列表（编号/模块/优先级/状态）
      - 功能模板（故事/主流程/AC/规则/NFR）
      - 用户故事地图（旅程×优先级）
      - 业务规则清单（关联 FR）
      - 用例图 (由系统自动生成 SVG 内嵌)
    example: |
      ```markdown
      ### FR-NNN <功能名>
      - 优先级：Must / Should / Could / Won't
      #### 用户故事
      作为 <角色>，我希望 <动作>，以便 <价值>
      #### 验收标准
      - [ ] AC1: <可测条件>
      #### 业务规则
      - BR-NNN: <规则>
      ```

  - idx: 4
    title: 非功能需求
    purpose: 以可量化、可验证的方式定义非功能需求
    sections: []
    key_points:
      # v8-P0-D: 去硬编码, NFR 编号体系与具体指标必须从代码配置/AGENTS.md 提取
      - 性能 NFR-P-XXX（指标值从代码配置/AGENTS.md 提取, 如 P99/QPS/并发数, 不预设具体数值）
      - 可用性 NFR-A-XXX（可用率/RTO/RPO, 数值从代码配置提取）
      - 安全 NFR-S-XXX（认证/授权方式从代码提取, 不预设 OAuth2/RBAC/TLS 1.3）
      - 可扩展性 NFR-SC-XXX（水平扩展/数据规模, 从代码架构推导）
      - 可维护性 NFR-M-XXX（部署时间/MTTR/可观测性, 从代码配置提取）
      - 可访问性 NFR-AC-XXX（WCAG 2.1 AA, 若代码无前端则标注"不适用"）
      - 兼容性 NFR-C-XXX（浏览器/设备/系统/网络, 从代码配置提取）
      - 本地化 NFR-L-XXX（本地化与国际化, 从代码 i18n 配置提取）

  - idx: 5
    title: 接口需求
    purpose: 定义用户接口、外部系统接口与硬件通信接口
    sections: []
    key_points:
      - 用户接口 UI（页面/交互/AC）
      - 外部系统接口（方向/协议/格式/SLA）
      - 硬件接口（设备/类型/协议）
      - 通信接口（协议/端口/加密）
      - 内部模块接口（调用方/协议/频次）

  - idx: 6
    title: 数据需求
    purpose: 定义数据模型、数据字典与数据流转
    sections: []
    key_points:
      - 数据模型 ER 图
      - 数据字典（类型/必填/取值/来源）
      - 数据流转全链路（产生→销毁）
      - 数据保留与销毁（依据法规）
      - 数据质量（完整/准确/时效/一致）
      - 数据埋点（事件/属性/用途）
    example: |
      ## 数据模型 (ER 概念)
      | 实体 | 字段 | 类型 | 关系 |
      |------|------|------|------|
      | <从代码 Entity 提取> | <从代码字段提取> | PK/FK | <从代码关系提取> |
      说明: 系统会根据本章节标题自动生成 SVG ER 图并内嵌, 正文不要输出 PlantUML/Mermaid 代码。

  - idx: 7
    title: 约束条件
    purpose: 明确业务、技术、合规、资源约束
    sections: []
    key_points:
      - 业务约束（来源/影响）
      - 技术约束（技术栈/部署/集成）
      - 合规约束（PIPL/GDPR/等保 2.0）
      - 资源约束（预算/人力/上线节点）
      - 标准与规范链接

  - idx: 8
    title: 优先级与路线图
    purpose: 定义优先级方法、矩阵、Kano 模型与里程碑
    sections: []
    key_points:
      - 优先级方法 MoSCoW（价值×成本×风险）
      - 功能优先级矩阵
      - Kano 模型（基本/期望/兴奋型）
      - 里程碑 M1/M2/M3（日期/范围/责任人）
      - 范围管理（RFC/CCB 变更流程）

  - idx: 9
    title: 风险与依赖
    purpose: 登记风险、外部依赖与未决事项
    sections: []
    key_points:
      - 风险登记（概率/影响/缓解/责任人）
      - 外部依赖（提供方/预计就绪/状态）
      - 未决事项 Open Questions
      - 假设验证计划（方式/时间/责任人）

  - idx: 10
    title: 附录
    purpose: 提供 Persona 完整卡、用例详述、术语表、追踪矩阵
    sections: []
    key_points:
      - Persona 完整卡（角色/目标/痛点/场景）
      - 用例详述模板（前置/主流程/异常）
      - 术语表（与 §1.4 同步）
      - 需求追踪矩阵 RTM
      - 参考资料（IEEE 29148/《启示录》/JTBD）
      - 评审记录与变更历史

writing_rules:
  - 使用 FR/NFR/IR/DR/C/BR-NNN 编号体系
  - 确保 NFR 可量化、可验证
  - 为每条 FR 给出验收标准 AC
  - 采用"作为...我希望...以便..."三段式用户故事
  - 为需求绑定 Persona 避免功能蔓延
  - 维护需求追踪矩阵 RTM 端到端追踪

output_format:
  default_language: zh
  default_format: markdown
  chapter_numbering: "1, 1.1, 1.1.1"
  diagrams: SVG (由系统自动生成并内嵌, 禁止 PlantUML/Mermaid)
  tables: Markdown 表格
  to_word: pandoc 本文件 -o 输出.docx --toc --toc-depth=3
