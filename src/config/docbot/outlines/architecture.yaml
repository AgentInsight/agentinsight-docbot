report_type: architecture
name_zh: 技术架构文档
name_en: Technical Architecture Document
default_chapters: 12
max_chapters: 20

persona:
  role: 首席架构师
  mission: >
    描述系统结构、组件关系、质量属性与 ADR，回答「系统长什么样、为何建成这样」。
    粒度为止于系统/容器/组件视图；不等于概要设计（需求→模块落地）也不输出完整 API 参数表。
  target_audience:
    - 架构师/决策者
    - 资深开发工程师
    - SRE/运维

chapters:
  - idx: 1
    title: 系统概述
    purpose: 阐明业务背景、系统定位、范围边界与利益相关方
    sections: []
    key_points:
      - 业务背景与目标
      - 系统定位与核心价值
      - 利益相关方矩阵
      - 范围边界 In-Scope/Out-of-Scope
      - 读者画像与阅读路径
      - 术语表
    example: |
      | 角色 | 关注点 | 影响力 | 参与方式 |
      |------|-------|-------|---------|
      | <角色> | <关注点> | 高/中/低 | <方式> |

  - idx: 2
    title: 架构原则与决策
    purpose: 明确架构原则、设计准则与关键决策记录
    sections: []
    key_points:
      - 架构原则(原则-理由-含义-反例)
      - 设计准则(接口/一致性/失败处理)
      - ADR 索引表
      - 反模式清单
    example: |
      | # | 原则 | 理由 | 含义 | 反例 |
      |---|------|------|------|------|
      | 1 | API 优先 | <理由> | <含义> | <反例> |

  - idx: 3
    title: 整体架构
    purpose: 描述架构风格、系统上下文与外部接口
    sections: []
    key_points:
      - 架构风格选型(微服务/单体/事件驱动/Serverless)
      - 系统上下文图 C4 Level 1
      - 外部系统与接口清单
      - 关键架构视图(逻辑/部署/数据)
    example: |
      ## 系统上下文 (C4 Level 1)
      | 参与方 | 类型 | 职责 | 协议 |
      |--------|------|------|------|
      | <用户> | Person | <动作> | HTTP |
      | <系统名> | System | <职责> | - |
      | <外部系统> | System_Ext | <职责> | <协议> |
      说明: 系统会根据本章节标题自动生成 SVG 架构图并内嵌, 正文不要输出 PlantUML/Mermaid 代码。

  - idx: 4
    title: 核心组件
    purpose: 拆解容器级组件、职责与交互（结构级，非接口契约手册）
    sections: []
    key_points:
      - 容器级架构图 C4 Level 2
      - 组件清单(职责/技术栈/团队/依赖)
      - 组件间交互协议与可靠性要点（协议/方向/失败语义，禁止完整参数表）
      - 核心流程时序要点（表格描述，配图由系统生成）
      - 完整 API 参数/错误码留给 api_doc；模块落地细节留给 design
    example: |
      ## 容器级组件清单 (C4 Level 2)
      | 组件 | 类型 | 技术栈 | 职责 | 依赖 |
      |------|------|--------|------|------|
      | API 服务 | Container | <技术> | <职责> | 数据库 |
      | 数据库 | ContainerDb | <技术> | <数据存储> | - |
      说明: 系统会根据本章节标题自动生成 SVG 组件图并内嵌, 正文不要输出 PlantUML/Mermaid 代码。

  - idx: 5
    title: 数据架构与数据流
    purpose: 定义数据分类、模型、存储选型与数据流
    sections: []
    key_points:
      - 数据分类与生命周期
      - 数据模型(概念/逻辑/物理)
      - 存储选型矩阵
      - 数据流图(同步+异步)
      - 数据治理(所有权/血缘/质量)
      - 数据安全与合规

  - idx: 6
    title: 部署架构
    purpose: 描述部署拓扑、网络、容器与 IaC 策略
    sections: []
    key_points:
      - 部署拓扑(多区域/多云/混合云)
      - 网络架构(VPC/出入口/DNS/CDN)
      - 计算与容器(K8s/Serverless)
      - 基础设施即代码(Terraform/Pulumi)
      - 环境策略(Dev/Test/Staging/Prod)

  - idx: 7
    title: 技术选型
    purpose: 提供技术选型矩阵与决策依据
    sections: []
    key_points:
      - 技术选型矩阵(分层/候选/评分/ADR)
      - 选型原则(开源优先/团队熟悉度/总成本)
      - 反模式清单

  - idx: 8
    title: 可扩展性与性能
    purpose: 定义性能目标、容量规划与扩展模型
    sections: []
    key_points:
      - 性能目标(P50/P95/P99/吞吐/并发)
      - 容量规划(基线/增长率/扩容路径)
      - 扩展模型(水平/垂直/缓存/分区)
      - 关键瓶颈与优化方案
      - 压测方案(k6/JMeter/Locust)
      - 性能预算(前端/后端/数据库)

  - idx: 9
    title: 安全性与合规
    purpose: 定义安全模型、IAM、威胁建模与合规框架
    sections: []
    key_points:
      - 零信任安全模型五层
      - IAM(OAuth2/OIDC/RBAC+ABAC/SSO/MFA)
      - 威胁建模(STRIDE/风险等级/缓解)
      - 密钥与机密管理(KMS/Vault/轮转)
      - 网络与应用安全(WAF/DDoS/SAST/DAST)
      - 合规框架(ISO 27001/等保/GDPR)
      - 审计与取证

  - idx: 10
    title: 可靠性与可观测性
    purpose: 定义 SLI/SLO/SLA、高可用拓扑与监控三支柱
    sections: []
    key_points:
      - SLI/SLO/SLA 矩阵(含错误预算)
      - 高可用拓扑(多活/主备/故障转移)
      - 灾备策略(RTO/RPO/演练频率)
      - 韧性模式(限流/熔断/降级/重试)
      - 监控三支柱(Metrics/Logging/Tracing)
      - 告警与值班(级别/路由/Runbook)
      - 混沌工程与备份恢复

  - idx: 11
    title: 演进与治理
    purpose: 建立架构治理、合规检查、债务登记与演进路径
    sections: []
    key_points:
      - 架构治理(ARB/RFC/ADR 流程)
      - 架构合规检查(Fitness Function)
      - 技术债务登记
      - 演进路径(Strangler Fig/数据迁移)
      - 风险与未决事项
      - 文档维护机制

  - idx: 12
    title: 附录
    purpose: 提供 ADR 索引、图表索引与参考资料
    sections: []
    key_points:
      - ADR 索引
      - 图表索引
      - 参考资料
      - 变更历史

writing_rules:
  - 回答「系统长什么样、为何如此」；读者应能画出 C4 Container 级图，但不依赖完整 API 参数表
  - 与 design 区分：architecture=系统蓝图与质量属性；design=需求→模块→接口→数据→运行落地
  - 弱化模块接口契约细节；完整参数/错误码留给 api_doc；外部接口可保留方法+路径清单
  - 组件/依赖/部署/数据流须带 path 或 path:line 证据（弱化细节 ≠ 减少引用）
  - 每章末附图示与 ADR 链接；矩阵类信息优先用表格
  - 架构/时序/组件图由系统自动生成 SVG 内嵌, 正文禁止输出 PlantUML/Mermaid 代码
  - 量化指标必须给出来源；无证据标注 insufficient_evidence
  - 禁止硬编码与本仓库无关的特定产品/仓库业务事实

output_format:
  default_language: zh
  default_format: markdown
  chapter_numbering: "1, 1.1, 1.1.1"
  diagrams: SVG (由系统自动生成并内嵌, 禁止 PlantUML/Mermaid)
  tables: Markdown 表格, 避免过宽
  to_word: pandoc 本文件 -o 输出.docx --toc --toc-depth=3
