name: 🐛 Bug 报告
description: 报告一个 Bug 帮助我们改进
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告 Bug! 请尽量填写完整信息以便我们快速定位。

        ⚠️ **安全提醒**: 禁止在 Issue 中包含 API Key、Token、密码、JWT、用户仓库内容等敏感信息。
        如发现安全漏洞, 请通过
        [Security Policy](https://github.com/AgentInsight/agentinsight-docbot/security/policy)
        私下报告, 勿公开 Issue。

        📖 提交前请先查阅 `README.md` 与 `AGENTS.md`。
  - type: dropdown
    id: report_type
    attributes:
      label: 报告类型
      options:
        - Bug (功能不符合预期)
        - Feature (新功能建议)
        - Question (使用问题)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      value: |
        - OS: [如 Windows 11 / Ubuntu 22.04 / macOS 14]
        - Python: [如 3.12.1, 项目要求 ≥3.11]
        - Docker / Compose: [版本]
        - 项目版本: [git commit hash 或 v1.0.1]
        - 部署模式: [生产联网 / QA离线 / 生产离线 / 本地 uvicorn]
        - Agent: agentinsight-docbot (端口 8068)
        - LLM 模型: [如 deepseek/deepseek-v4-flash]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动栈: `docker compose -p agentinsight-docbot up -d`
        2. 配置仓库: `POST /v1/repos` ...
        3. 发送: `POST /v1/chat/completions` ...
        4. 观察到...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志(已脱敏)
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: 自查清单
      options:
        - label: 我已查阅 README / AGENTS.md, 确认非配置问题
          required: true
        - label: 我已搜索现有 Issue, 确认无重复报告
          required: true
        - label: 我已对日志/请求体中的敏感信息脱敏
          required: true
