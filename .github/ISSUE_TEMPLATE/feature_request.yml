name: ✨ 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议!

        请确认: 是否已被 8 种文档类型 / 6 步流水线 / `/v1/repos` 等现有能力覆盖;
        是否与「无前端 / 无 SearXNG / 不暴露 feedback·ws·mcp configs」边界冲突。
  - type: textarea
    id: feature_description
    attributes:
      label: 功能描述
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: 建议的方案
      placeholder: |
        建议在 `src/graph/` 或 `src/skills/docbot/` ...
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - graph/ (LangGraph)
        - agents/docbot/
        - skills/docbot/
        - rag/
        - api/ (含 repo_routes)
        - tools/git_mcp
        - 部署/运维
        - 文档/评测
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: 自查清单
      options:
        - label: 我已查阅 README / AGENTS.md
          required: true
        - label: 我已搜索现有 Issue, 确认无重复建议
          required: true
